# Google's Gemini models through the official Gemini CLI, signed in with the
# user's Google account (a Google AI Pro plan: 1,500 model requests a day).
#
# harness=gemini-cli makes the worker the CLI itself in headless mode
# (`gemini -p ... -o json --approval-mode yolo`) rather than a Claude Code
# session pointed at an endpoint. The plan funds no API key and Google forbids
# using the CLI's OAuth from any other software (geminicli.com tos-privacy), so
# this is the one legitimate way to spend that quota. No base_url, no
# credential file: the login lives in ~/.gemini/oauth_creds.json, written by an
# interactive `gemini` login once.
#
# model is informational: the CLI picks across the Gemini family under a
# subscription login; set it to a concrete id (e.g. gemini-2.5-pro) to pass -m.
harness=gemini-cli
model=auto
billing=requests
daily_requests=1500
