# Google's models through the official Antigravity CLI (`agy`), signed in with
# the user's Google account (a Google AI Pro plan: a quota refreshed every five
# hours up to a weekly cap; Google publishes no numbers).
#
# harness=antigravity-cli makes the worker the CLI itself in headless mode
# (`agy -p ... --output-format json --dangerously-skip-permissions`) rather
# than a Claude Code session pointed at an endpoint. The plan funds no API key
# and Google forbids using the CLI's login from any other software, so this is
# the one legitimate way to spend that quota. No base_url, no credential file:
# the login lives with the CLI (~/.gemini/antigravity-cli/), made once by
# running `agy` and signing in with Google. Gemini CLI, the previous shape,
# stopped serving personal accounts on 2026-06-18.
#
# model is the default slug; models= lists what `start --model` may pick per run; `auto` leaves the
# choice to the CLI, which does not record it anywhere the sidecar can read.
# gemini-3.8-flash-high is the newest Flash at its highest reasoning effort
# (the -medium and -low slugs are the same model, faster and cheaper on quota;
# gemini-3.1-pro-high is the Pro line).
# print_timeout bounds one run (the CLI's own default, 5m, fits no coding task).
# billing=quota: `spend` counts runs and shows a run that hit the quota; the
# quota itself is not readable headless. start refuses if the CLI's settings
# allow purchased AI credits (money) as a fallback.
harness=antigravity-cli
model=gemini-3.8-flash-high
models=gemini-3.8-flash-high,gemini-3.8-flash-medium,gemini-3.8-flash-low,gemini-3.1-pro-high,gemini-3.1-pro-low
roster=Gemini 3.8 Flash (default) or 3.1 Pro (--model gemini-3.1-pro-high|-low), free on the plan, an iterative loop (start runs a turn to completion; say --worker NAME --task continues the conversation): Flash a fast coder for small and larger tasks, Pro a slower coding expert for planning, review and brainstorming
billing=quota
print_timeout=2h
