# DeepSeek, through its Anthropic-format endpoint.
#
# No credential here. This repository is public; the key lives outside it, in
# $HOME/.claude/sidecar-credentials at mode 0600, under the name cred_key names.
#
# model_alias is what gets passed to `claude --model`, and it is deliberately a
# Claude name. Claude Code validates model ids against its own catalogue before
# a request leaves the machine, so a provider id kills the session outright —
# "There's an issue with the selected model" — even though that same id returns
# HTTP 200 from the endpoint by curl. The provider's own mapping turns
# claude-sonnet* into deepseek-flash. See DESIGN.md §10a.
#
# model is the true id, and exists because the worker cannot tell what it is:
# its transcript records the alias it was given, not what served the request.
base_url=https://api.deepseek.com/anthropic
cred_var=ANTHROPIC_AUTH_TOKEN
cred_key=DEEPSEEK_API_KEY
model=deepseek-flash
model_alias=sonnet
