# Prices in MICRO-USD per million tokens, as whole numbers.
#
# Integers because bash has no floating point and this project ships no awk,
# python or bc. Micro-USD per million keeps every real price an exact integer
# and leaves the arithmetic well inside 64-bit range.
#
# Priced at PEAK rates. DeepSeek charges half off-peak (peak is 01:00-04:00 and
# 06:00-10:00 UTC, Monday to Friday), so pricing at peak means the ledger
# over-states rather than under-states against a spend cap. That is the same
# conservative direction the budget module takes when it truncates percentages.
#
# input_cached is what a cache read costs. Cache *writes* are not a separate
# charge on DeepSeek, so cache_creation_input_tokens are billed as ordinary
# missed input and counted with it.
#
# Source: https://api-docs.deepseek.com/quick_start/pricing, read 2026-09-12.
# Check it before trusting a spend figure; a stale table is a wrong number, and
# a wrong number here is worse than no number.
#
# provider  model             input_miss  input_cached   output
deepseek    deepseek-flash        300000          6000  1200000
deepseek    deepseek-v4-pro      1320000         44000  3960000
